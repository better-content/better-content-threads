name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BC_CUSTOM_MOD_JAR_DIR: ${{ github.workspace }}/build/ci-provider-jars
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned provider baseline
        uses: actions/checkout@v4
        with:
          repository: better-content/better-content-modpack
          ref: 7daccf81465d0803824831f014d695419c6e7696
          path: build/ci-pack-baseline
          sparse-checkout: |
            .github/scripts
            gradle/active-custom-mods.json
            index.toml
            mods
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check provider provenance validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Build pinned API providers over the verified baseline
        run: >-
          python3 .github/scripts/prepare-source-providers.py
          --pack-root build/ci-pack-baseline
          --output "$BC_CUSTOM_MOD_JAR_DIR"
      - name: Verify repository
        run: ./gradlew --no-daemon verifyFull stageRuntimeJar
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-verification
          path: |
            build/reports/
            build/test-results/
            build/ci-provider-jars/providers.json
          if-no-files-found: ignore
          retention-days: 14
